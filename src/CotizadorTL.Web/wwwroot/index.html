<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cotizador Thin Laminates</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css?v=85" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CotizadorTL.Web.styles.css?v=85" rel="stylesheet" />
    <script type="importmap"></script>
    <script>window.__APP_VER = "85";</script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="lib/jspdf/jspdf.umd.min.js?v=85"></script>
    <script src="lib/jspdf/jspdf.plugin.autotable.min.js?v=85"></script>
    <script src="js/logos.js?v=85"></script>
    <script src="js/fonts.js?v=85"></script>
    <script src="js/fns.js?v=85"></script>
    <script src="js/pdf.js?v=85"></script>
    <script src="lib/exceljs/exceljs.min.js?v=85"></script>
    <script src="js/excel.js?v=85"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
      // Arranque con REINTENTOS. GitHub Pages (CDN) a veces devuelve un 503 pasajero en algún
      // .wasm (más común detrás de proxy/antivirus corporativo); como Blazor valida integridad,
      // un solo 503 mataba el arranque con "error inesperado". Ahora se reintenta con backoff
      // y descarga forzada, igual que una ventana de incógnito.
      (function () {
        function cargarConReintento(type, name, defaultUri, integrity) {
          if (type === "dotnetjs") return undefined; // lo carga Blazor por <script>, no tocar
          return (async function () {
            var ultimoError;
            for (var i = 0; i < 5; i++) {
              try {
                var resp = await fetch(defaultUri, {
                  cache: i === 0 ? "default" : "reload",
                  integrity: integrity || undefined,
                });
                if (resp.ok) return resp;
                ultimoError = new Error("HTTP " + resp.status + " en " + name);
              } catch (e) { ultimoError = e; }
              await new Promise(function (r) { setTimeout(r, 500 * (i + 1)); });
            }
            throw ultimoError;
          })();
        }
        Blazor.start({ loadBootResource: cargarConReintento }).catch(function (e) {
          console.error("Blazor.start falló:", e);
        });
      })();
    </script>

    <!-- Auto-recuperación: si tras un deploy el navegador tiene el index.html viejo en caché, el WASM no arranca
         (se queda el spinner o sale el error). Recarga UNA vez saltándose la caché; con guarda para no ciclar. -->
    <script>
      (function () {
        var KEY = "tl_reintento_arranque";

        // Chequeo de versión: si el index.html en caché es viejo, version.txt (sin caché) no coincide
        // con la versión embebida -> recarga saltándose la caché (con guarda por versión, sin ciclos).
        try {
          fetch("version.txt?_=" + Date.now(), { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : null; })
            .then(function (remoto) {
              if (!remoto) return;
              remoto = remoto.trim();
              var local = window.__APP_VER || "";
              if (remoto && local && remoto !== local) {
                if (sessionStorage.getItem("tl_ver_reload") !== remoto) {
                  sessionStorage.setItem("tl_ver_reload", remoto);
                  var u = location.href.split("#")[0];
                  u += (u.indexOf("?") >= 0 ? "&" : "?") + "cb=" + Date.now();
                  location.replace(u);
                }
              } else {
                sessionStorage.removeItem("tl_ver_reload");
              }
            })
            .catch(function () { });
        } catch (e) { }

        setTimeout(function () {
          var spinner = document.querySelector("#app .loading-progress");
          var eu = document.getElementById("blazor-error-ui");
          var errorVisible = eu && getComputedStyle(eu).display !== "none";
          var noArranco = !!spinner || errorVisible;
          if (noArranco && !sessionStorage.getItem(KEY)) {
            sessionStorage.setItem(KEY, "1");
            var u = location.href.split("#")[0];
            u += (u.indexOf("?") >= 0 ? "&" : "?") + "cb=" + Date.now();
            location.replace(u);   // fuerza re-descarga del index.html (nueva clave de caché)
          } else if (!noArranco) {
            sessionStorage.removeItem(KEY);                 // arrancó bien: limpia la guarda
            if (location.href.indexOf("cb=") >= 0) {         // y quita el ?cb= de la barra
              try { history.replaceState(null, "", location.href.replace(/[?&]cb=\d+/, "").replace(/[?&]$/, "")); } catch (e) { }
            }
          }
        }, 15000);
      })();
    </script>
</body>

</html>
